onboarding = false

# herdr config, modeled after ~/.tmux.conf

[keys]
# remap prefix from ctrl+b to ctrl+a
prefix = "ctrl+a"

# split panes using | and - (matches tmux `bind | split-window -h` / `bind - split-window -v`)
# new panes already follow the current pane's cwd by default (terminal.new_cwd = "follow")
split_vertical = "prefix+|"      # side-by-side, like tmux's -h split
# split_horizontal already defaults to "prefix+minus", matching tmux's - split

# switch panes using Alt-arrow without prefix, in addition to the default prefix+h/j/k/l
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

# detach like tmux: prefix+d (tmux default), plus herdr's own prefix+q
detach = ["prefix+q", "prefix+d"]

# workspace_picker already defaults to prefix+w (herdr's workspace = tmux's session);
# close_workspace already defaults to prefix+shift+d for closing one

[terminal]
# use $SHELL for new panes (same as tmux's `set -g default-command $SHELL`)
default_shell = ""

[ui]
# Enable mouse mode (tmux 2.1 and above)
mouse_capture = true
show_agent_labels_on_pane_borders = true
# No persistent sidebar; use prefix+w (workspace_picker) to jump around instead.
# Takes effect on next full server restart, not just reload-config.

# sidebar_start_collapsed = true
# sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "system"

[theme]
name = "kanagawa"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = false
pane_history = true

[advanced]
# match tmux's `set-option -g history-limit 50000`
scrollback_lines = 50000
