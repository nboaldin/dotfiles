# Linux (Arch/GNOME) values. install.sh links this to local.toml on Linux.
# Settings set here must not also appear in alacritty.toml (it overrides imports).
#
# Size 9 because GNOME scales these displays 1.67x (built-in) / 1.5x (external)
# and Alacritty multiplies the point size by that scale.

[font]
size = 11

[window]
startup_mode = "Windowed"

[scrolling]
multiplier = 10
