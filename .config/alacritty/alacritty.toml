# Per-OS font size and window values live in darwin.toml / linux.toml. install.sh links the
# right one to local.toml. NOTE: the importing file wins over its imports, so the
# per-OS settings must NOT also be set in this file.
[general]
import = ["~/.config/alacritty/local.toml"]

[colors.primary]
background = "#262a33" # bg
foreground = "#bbc2cf" # fg

[colors.normal]
black = "#262a33"   # bg
red = "#e95678"     # red
green = "#1ABC9C"   # green - zephyr neovim teal
yellow = "#f7bb3b"  # yellow
blue = "#61afef"    # blue
magenta = "#CBA6F7" # violet
cyan = "#36d0e0"    # cyan
white = "#504945"   # bg1

[colors.bright]
black = "#928374"   # grey
red = "#e95678"     # red
green = "#1ABC9C"   # green - zephyr neovim teal
yellow = "#f7bb3b"  # yellow
blue = "#61afef"    # blue
magenta = "#CBA6F7" # violet
cyan = "#36d0e0"    # cyan
white = "#bbc2cf"   # fg

[env]
TERM = "xterm-256color"

[font.bold]
family = "Maple Mono NF"
style = "Bold"

[font.normal]
family = "Maple Mono NF"
style = "Thin"

[font.offset]
x = 1
y = 1

[window]
option_as_alt = "Both"
decorations = "Buttonless"
